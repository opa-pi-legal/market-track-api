openapi: 3.0.3
info:
  title: Market API
  version: 1.0.0
paths:
  /market-api/api/market/:
    get:
      operationId: market_api_api_market_list
      tags:
      - market-api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'
          description: ''
    post:
      operationId: market_api_api_market_create
      tags:
      - market-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Market'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Market'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Market'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
          description: ''
  /market-api/api/market/{id}/:
    get:
      operationId: market_api_api_market_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this market.
        required: true
      tags:
      - market-api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
          description: ''
    put:
      operationId: market_api_api_market_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this market.
        required: true
      tags:
      - market-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Market'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Market'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Market'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
          description: ''
    patch:
      operationId: market_api_api_market_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this market.
        required: true
      tags:
      - market-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMarket'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMarket'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMarket'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
          description: ''
    delete:
      operationId: market_api_api_market_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this market.
        required: true
      tags:
      - market-api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
components:
  schemas:
    Market:
      type: object
      properties:
        group_id:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 150
        brand:
          type: string
          maxLength: 100
        address:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        added_by:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - added_by
      - created_at
      - group_id
      - name
    PatchedMarket:
      type: object
      properties:
        group_id:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 150
        brand:
          type: string
          maxLength: 100
        address:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        added_by:
          type: string
          maxLength: 128
        created_at:
          type: string
          format: date-time
          readOnly: true
    StatusEnum:
      enum:
      - active
      - archived
      type: string
      description: |-
        * `active` - Active
        * `archived` - Archived
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
servers:
- url: /market-api
- url: http://localhost:90/market-api
