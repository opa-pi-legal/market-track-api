upstream django_user_backend {
    
    server user-api:8000 max_fails=3 fail_timeout=10s;
    
}

upstream django_groups_backend {
    
    server groups-api:8001 max_fails=3 fail_timeout=10s;
    
}

upstream django_market_backend {
    
    server 172.17.0.1:8002 down;
    
}

server {
    listen 80;
    
    client_max_body_size 20M;

    location /static/ {
        alias /var/www/django/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/django/media/;
        expires 30d;
        access_log off;
    }

    location /users-api/ {
        proxy_pass http://django_user_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-Ip $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /groups-api/ {
        proxy_pass http://django_groups_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-Ip $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /market-api/ {
        proxy_pass http://django_market_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-Ip $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}