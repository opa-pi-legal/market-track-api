services:

  consul:
    image: consul:1.15.4
    container_name: consul-server
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"
    restart: always
  
  nginx:
    build:
      context: ./nginx
    container_name: nginx-proxy
    ports:
      - "90:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - consul
    command: sh -c "consul-template -consul-addr=consul:8500 -template='/etc/nginx/templates/nginx.conf.ctmpl:/etc/nginx/conf.d/default.conf:nginx -s reload' & nginx -g 'daemon off;'"    
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rebbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file: ".env"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-api:
    build: 
      context: .
      dockerfile: userApi/Dockerfile
    container_name: user_api_service
    restart: always
    command: gunicorn userApi.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./userApi:/app
    ports:
      - "8000:8000"
    depends_on:
      - consul
      - nginx
      - rabbitmq
    env_file: 
     - .env
  
  groups-api:
    build:
      context: .
      dockerfile: groupsApi/dockerfile
    container_name:  groups_api_service
    restart: always
    command: gunicorn groupsApi.wsgi:application --bind 0.0.0.0:8001
    volumes:
      - ./groupsApi:/app
    ports:
      - "8001:8001"
    depends_on:
      - consul
      - nginx
      - rabbitmq
    env_file:
      - .env

volumes:
  rabbitmq-data:      