services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_CORE_DB:-core_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  consul:
    image: consul:1.15.4
    container_name: consul-server
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"
    restart: always

  nginx:
    build:
      context: ./nginx
    container_name: nginx-proxy
    ports:
      - "90:80"
      - "8090:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./docs:/etc/nginx/docs:ro
    depends_on:
      - consul
    command: sh -c "consul-template -consul-addr=consul:8500 -template='/etc/nginx/templates/nginx.conf.ctmpl:/etc/nginx/conf.d/default.conf:nginx -s reload' & nginx -g 'daemon off;'"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rebbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    env_file: ".env"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  core-api:
    build:
      context: .
      dockerfile: core_api/dockerfile
    container_name: core_api_service
    restart: always
    command: sh -c "python manage.py migrate --noinput && (python manage.py consume_events &) && gunicorn -c /app/gunicorn.conf.py core_api.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./core_api:/app
      - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
    ports:
      - "8000:8000"
    depends_on:
      consul:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
    env_file:
      - .env

  market-api:
    build:
      context: .
      dockerfile: market_api/dockerfile
    container_name: market_api_service
    restart: always
    command: sh -c "python manage.py migrate --noinput && (python manage.py consume_events &) && gunicorn -c /app/gunicorn.conf.py market_api.wsgi:application --bind 0.0.0.0:8002"
    volumes:
      - ./market_api:/app
      - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
    ports:
      - "8002:8002"
    depends_on:
      consul:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
    env_file:
      - .env

  product-api:
    build:
      context: .
      dockerfile: product_api/Dockerfile
    container_name: product-api_service
    restart: always
    command: sh -c "python manage.py migrate --noinput && (python manage.py consume_events &) && gunicorn -c /app/gunicorn.conf.py product_api.wsgi:application --bind 0.0.0.0:8004"
    volumes:
      - ./product_api:/app
      - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
    ports:
      - "8004:8004"
    depends_on:
      consul:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
    env_file:
      - .env

  migrate-core:
    build:
      context: .
      dockerfile: core_api/dockerfile
    container_name: core_migrate
    command: sh -c "python manage.py migrate --noinput"
    volumes:
      - ./core_api:/app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    profiles: ["tools"]

  migrate-market:
    build:
      context: .
      dockerfile: market_api/dockerfile
    container_name: market_migrate
    command: sh -c "python manage.py migrate --noinput"
    volumes:
      - ./market_api:/app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    profiles: ["tools"]

  migrate-product:
    build:
      context: .
      dockerfile: product_api/Dockerfile
    container_name: product_migrate
    command: sh -c "python manage.py migrate --noinput"
    volumes:
      - ./product_api:/app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    profiles: ["tools"]

volumes:
  rabbitmq-data:
  postgres_data:
